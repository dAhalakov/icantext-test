<!DOCTYPE html>
<html lang="ru">
	<head>
	  <meta charset="UTF-8">
	  <title>iCanText HTML Test</title>
	  <link rel="stylesheet" href="style.css">
	</head>
	<body>
		<div id="main-body" class="main-body">
			<div id="app-body" class="app-body">
				<h2 class="app-title">iCanText - Votes</h2>
				<span id="my-id" class="my-id">my-id</span>
				<div id="configuration-votes" class="card">
					<div id="container-content">
						<h3>Configuration votes</h3>
						<h4>Ask a question</h4>
						<input type="text" name="question" placeholder="Type your question...">
						<div id="vars-response">
		  					<h4>Variants of response</h4>

		  <div class="response-item">
		    <input type="text" name="response1" placeholder="Variant 1">
		  </div>
		</div>

		<button id="add-new-response">Add new variant of response</button>
					</div>
					<h4>Type of choise</h4>
					<div id="container-configuration">
						<label><input type="radio" name="choise" value="single" checked="true">Single choise</label>
						<label><input type="radio" name="choise" value="multiple">Multiple choise</label>
					</div>
					<div class="create-vote-wrapper">
					  	<button id="cancel-vote-btn" class="btn-secondary">Cancel</button>
					  	<button id="create-vote-btn" class="btn-primary">Create vote</button>
					</div>
				</div>


				<div id="vote-container" class="card vote-container">

					<table>
						<tr>
							<th>.question.</th>
							<th></th>
						</tr>
						<tr>
							<td>.variant 1.</td>
							<td><input type="radio" id="var1" name="var1" value="var1"/></td>
						</tr>
						<tr>
							<td>.variant 2.</td>
							<td><input type="radio" id="var2" name="var2" value="var2"/></td>
						</tr>
					</table>
					.block of vote.
				</div>
			</div>
			<div id="error-log" class="error-log">.error.</div>
		</div>

		
		<script src="https://icantext.com/ICTBridgeSDK.js"></script>
		<script>
		    
		    // initialize iCanText Bridge SDK
		    const sdk = new ICTBridgeSDK('votes_app');

		    // start app
		    async function startApp() {
		        const connection = await sdk.init();

		        // stop execution if app is not launched from iCanText
		        if (connection.status !== 'READY') {
		            console.warn('Running in ' + connection.status + ' mode');

			        // force configuration UI for local testing
			        initConfigMode();
			        return;
		        }

		        // display current user pseudonym
		        document.getElementById("my-id").textContent = connection.localPseudonym;

		        // determine how the app is rendered
		        const mode = sdk.getDisplayMode();
		        console.log(mode);

		        if (mode === 'MESSAGE') {
		            initVoteMode();
		        } else {
		            initConfigMode();
		        }
		    }

		    startApp();


		    // vote mode
		    async function initVoteMode() {
		        // hide block of configuration vote and show block of vote
		        document.getElementById('configuration-votes').style.display = 'none';
		        document.getElementById('vote-container').style.display = 'block';

		        // send in log the context of this vote
		        const state = await sdk.getAppContext();
		        console.log('Vote context:', state);

		        // TODO
		    }

		   // config mode
		    function initConfigMode() {
		        document.getElementById('vote-container').style.display = 'none';
		        document.getElementById('configuration-votes').style.display = 'block';

		        setupResponses();
		        setupButtons();
		    }

		    
		    // responses configuration
		    function setupResponses() {
		        const addBtn = document.getElementById('add-new-response');
		        const varsContainer = document.getElementById('vars-response');

		        let responseCount = 1;

		        // check if at least one existing input is empty
		        function hasEmptyResponse() {
		            const inputs = varsContainer.querySelectorAll('input[type="text"]');
		            for (let i = 0; i < inputs.length; i++) {
		                if (inputs[i].value.trim() === '') {
		                    return true;
		                }
		            }
		            return false;
		        }

		        // create new response input with remove button
		        function createResponseInput() {
		            if (hasEmptyResponse()) {
		                alert('Please fill in all existing variants before adding a new one.');
		                return;
		            }

		            responseCount++;

		            const wrapper = document.createElement('div');
		            wrapper.className = 'response-item';

		            const input = document.createElement('input');
		            input.type = 'text';
		            input.name = 'response' + responseCount;
		            input.placeholder = 'Variant ' + responseCount;

		            const removeBtn = document.createElement('button');
		            removeBtn.type = 'button';
		            removeBtn.className = 'remove-response';
		            removeBtn.textContent = 'X';

		            // remove variant on click
		            removeBtn.addEventListener('click', function () {
		                wrapper.remove();
		            });

		            wrapper.appendChild(input);
		            wrapper.appendChild(removeBtn);
		            varsContainer.appendChild(wrapper);
		        }

		        addBtn.addEventListener('click', createResponseInput);
		    }

		    // collect data of configuration
		    function collectDataVote() {
		        const data = {};

		        // collect question
		        const questionInput = document.querySelector('input[name="question"]');
		        data.question = questionInput.value.trim();

		        // collect choice type
		        const choiceInput = document.querySelector('input[name="choise"]:checked');
		        data.choiceType = choiceInput ? choiceInput.value : 'single';

		        // collect response variants
		        const responses = [];
		        const responseInputs = document.querySelectorAll('#vars-response input[type="text"]');

		        for (let i = 0; i < responseInputs.length; i++) {
		            const value = responseInputs[i].value.trim();
		            if (value !== '') {
		                responses.push(value);
		            }
		        }

		        data.responses = responses;

		        return data;
		    }

		    // handle buttons Create and Cancel
		    function setupButtons() {
		        const createVoteBtn = document.getElementById('create-vote-btn');
		        const cancelVoteBtn = document.getElementById('cancel-vote-btn');

		        createVoteBtn.addEventListener('click', onCreateVote);
		        cancelVoteBtn.addEventListener('click', onCancelVote);
		    }

		    /*
		        Create vote:
		        - Collect data
		        - Post a message to channel
		        - Attach interactive app content
		    */
		    async function onCreateVote() {
		        const voteData = collectDataVote();

		        let message = "New vote created: \n" + "Question: " + voteData.question;
		        // send message in channel
		        const messageId = await sdk.postMessage({
		            text: message
		        });
		        
		        // Attach app with initial context
		        await sdk.postAppContent(
		            'https://dahalakov.github.io/icantext-test/',
		            {
		                messageId: messageId,
		                vote: voteData
		            }
		        );
		        sdk.closeApp();
		    }

		    // cancel vote creation and close app
		    function onCancelVote() {
		        sdk.closeApp();
		    }
		</script>

	</body>
</html>
