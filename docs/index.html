<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>iCanText HTML Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="main-body" class="main-body">
<div id="app-body" class="app-body">

<div id="header-app">
    <h2 class="app-title">iCanText - Votes</h2>
    <span id="my-id" class="my-id">my-id</span>
</div>

<!-- CONFIGURATION MODE -->
<div id="configuration-votes" class="card" style="display:none;">
    <h3>Create vote</h3>

    <input type="text" id="question-input" placeholder="Type your question...">

    <div id="responses-container">
        <input type="text" class="response-input" placeholder="Variant 1">
    </div>

    <button id="add-response-btn">Add variant</button>

    <div>
        <label><input type="radio" name="choice" value="single" checked> Single</label>
        <label><input type="radio" name="choice" value="multiple"> Multiple</label>
    </div>

    <button id="create-vote-btn">Create vote</button>
    <button id="cancel-config-btn">Cancel</button>
</div>

<!-- VOTE MODE -->
<div id="vote-container" class="card vote-container" style="display:none;">
    <h4 id="table-question"></h4>
    <ul id="vote-list"></ul>

    <div id="vote-result-info" style="display:none;">
        <p id="vote-result-text"></p>
    </div>

    <div id="vote-actions">
        <button id="cancel-btn">Cancel</button>
        <button id="send-vote-btn">Send</button>
    </div>

    <div id="vote-result-actions" style="display:none;">
        <button id="undo-vote-btn">Cancel my vote</button>
        <button id="close-btn">Close</button>
    </div>
</div>

<div id="standalone-info">
    <h3>Run inside iCanText channel</h3>
</div>

</div>
</div>

<script src="https://icantext.com/ICTBridgeSDK.js"></script>
<script>
	const sdk = new ICTBridgeSDK('votes_app');

	let currentContext = null;
	let localVote = null;
	let hasVoted = false;
	let userVoteIndexes = [];

	async function startApp() {

	    const connection = await sdk.init();

	    if (connection.status !== 'READY') {
	        document.getElementById('standalone-info').style.display = 'block';
	        return;
	    }

	    document.getElementById("my-id").textContent = connection.localPseudonym;

	    if (sdk.getDisplayMode() === 'MESSAGE') {
	        initVoteMode();
	    } else {
	        initConfigMode();
	    }
	}

	startApp();


	sdk.onData((from, payload) => {
	    if (payload.type === 'vote-update') {
	        localVote.votes = payload.votes;
	        renderVote();
	    }
	});


	function initConfigMode() {
	    document.getElementById('configuration-votes').style.display = 'block';
	    document.getElementById('standalone-info').style.display = 'none';

	    document.getElementById('add-response-btn').onclick = () => {
	        const input = document.createElement('input');
	        input.type = 'text';
	        input.className = 'response-input';
	        input.placeholder = 'Variant';
	        document.getElementById('responses-container').appendChild(input);
	    };

	    document.getElementById('create-vote-btn').onclick = createVote;
	    document.getElementById('cancel-config-btn').onclick = () => sdk.closeApp();
	}

	async function createVote() {

	    const question = document.getElementById('question-input').value.trim();
	    const choiceType = document.querySelector('input[name="choice"]:checked').value;

	    const responseInputs = document.querySelectorAll('.response-input');
	    const responses = [];
	    const votes = [];

	    responseInputs.forEach(input => {
	        if (input.value.trim() !== '') {
	            responses.push(input.value.trim());
	            votes.push(0);
	        }
	    });

	    const voteData = {
	        question,
	        choiceType,
	        responses,
	        votes
	    };

	    const messageId = await sdk.postMessage({
	        text: "New vote: " + question
	    });

	    await sdk.postAppContent(
	        'https://dahalakov.github.io/icantext-test/',
	        {
	            messageId: messageId,
	            vote: voteData
	        }
	    );

	    sdk.closeApp();
	}


	async function initVoteMode() {

	    document.getElementById('vote-container').style.display = 'block';
	    document.getElementById('standalone-info').style.display = 'none';

	    currentContext = await sdk.getAppContext();
	    if (!currentContext) return;

	    localVote = currentContext.vote
	        ? JSON.parse(JSON.stringify(currentContext.vote))
	        : JSON.parse(JSON.stringify(currentContext));

	    renderVote();

	    document.getElementById('send-vote-btn').onclick = sendVote;
	    document.getElementById('undo-vote-btn').onclick = undoVote;
	    document.getElementById('cancel-btn').onclick = () => sdk.closeApp();
	    document.getElementById('close-btn').onclick = () => sdk.closeApp();
	}


	function renderVote() {

	    const question = document.getElementById('table-question');
	    const list = document.getElementById('vote-list');

	    question.textContent = localVote.question;
	    list.innerHTML = '';

	    const type = localVote.choiceType === 'multiple' ? 'checkbox' : 'radio';
	    const total = localVote.votes.reduce((a,b)=>a+b,0);

	    localVote.responses.forEach((label, index) => {

	        const li = document.createElement('li');

	        const input = document.createElement('input');
	        input.type = type;
	        input.name = 'vote';
	        input.value = index;
	        input.disabled = hasVoted;

	        const span = document.createElement('span');
	        span.textContent = label;

	        li.appendChild(input);
	        li.appendChild(span);

	        if (hasVoted) {
	            const percent = total > 0
	                ? ((localVote.votes[index] / total) * 100).toFixed(1)
	                : 0;

	            const info = document.createElement('small');
	            info.textContent = ` ${localVote.votes[index]} votes · ${percent}%`;
	            li.appendChild(info);
	        }

	        list.appendChild(li);
	    });
	}


	function sendVote() {

	    if (hasVoted) return;

	    const selected = document.querySelectorAll('input[name="vote"]:checked');
	    if (selected.length === 0) {
	        alert('Please select an option');
	        return;
	    }

	    userVoteIndexes = [];

	    selected.forEach(input => {
	        const index = Number(input.value);
	        localVote.votes[index]++;
	        userVoteIndexes.push(index);
	    });

	    hasVoted = true;

	    sdk.sendData({
	        type: 'vote-update',
	        votes: localVote.votes
	    });

	    renderVote();
	    showResult();
	}


	function undoVote() {

	    if (!hasVoted) return;

	    userVoteIndexes.forEach(index => {
	        localVote.votes[index]--;
	    });

	    hasVoted = false;
	    userVoteIndexes = [];

	    sdk.sendData({
	        type: 'vote-update',
	        votes: localVote.votes
	    });

	    document.getElementById('vote-actions').style.display = 'block';
	    document.getElementById('vote-result-info').style.display = 'none';
	    document.getElementById('vote-result-actions').style.display = 'none';

	    renderVote();
	}


	function showResult() {

	    document.getElementById('vote-actions').style.display = 'none';
	    document.getElementById('vote-result-info').style.display = 'block';
	    document.getElementById('vote-result-actions').style.display = 'block';

	    const names = userVoteIndexes.map(i => localVote.responses[i]);

	    document.getElementById('vote-result-text').textContent =
	        'You voted for: ' + names.join(', ');
	}

</script>
</body>
</html>
