<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>iCanText HTML Test</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<div id="main-body" class="main-body">
<div id="app-body" class="app-body">

<div id="header-app">
    <h2 class="app-title">iCanText - Votes</h2>
    <span id="my-id" class="my-id">my-id</span>
</div>

<!-- CONFIGURATION -->
<div id="configuration-votes" class="card" style="display:none;">
    <div id="container-content">
        <h3>Configuration votes</h3>

        <h4>Ask a question</h4>
        <input type="text" id="question-input" placeholder="Type your question...">

        <div id="vars-response">
            <h4>Variants of response</h4>

            <div class="response-item">
                <input type="text" class="response-input" placeholder="Variant 1">
            </div>
        </div>

        <button id="add-new-response">Add new variant of response</button>
    </div>

    <h4>Type of choice</h4>
    <div id="container-configuration">
        <label><input type="radio" name="choice" value="single" checked> Single choice</label>
        <label><input type="radio" name="choice" value="multiple"> Multiple choice</label>
    </div>

    <div class="create-vote-wrapper">
        <button id="cancel-vote-btn" class="btn-secondary">Cancel</button>
        <button id="create-vote-btn" class="btn-primary">Create vote</button>
    </div>
</div>

<!-- VOTE MODE -->
<div id="vote-container" class="card vote-container" style="display:none;">
    <h4 id="table-question"></h4>
    <ul id="vote-list"></ul>

    <div id="vote-result-info" style="display:none;">
        <p id="vote-result-text"></p>
    </div>

    <div id="vote-actions" class="vote-wrapper">
        <button id="send-vote-btn" class="btn-primary">Send</button>
    </div>

    <div id="vote-result-actions" class="vote-wrapper" style="display:none;">
        <button id="undo-vote-btn" class="btn-secondary">Cancel my vote</button>
    </div>

    <div id="not-voted-block" style="margin-top:15px;">
    	<h4>Did not vote yet:</h4>
    <ul id="not-voted-list"></ul>
</div>
</div>

<div id="standalone-info">
    <h2 style="color:#fff;">Survey Micro-App</h2>
</div>

</div>
</div>

<script src="https://icantext.com/ICTBridgeSDK.js"></script>
<script>

	const sdk = new ICTBridgeSDK('votes_app');

	let currentContext = null;
	let localVote = null;
	let hasVoted = false;
	let userVoteIndexes = [];


	async function startApp() {

	    const connection = await sdk.init();

	    if (connection.status !== 'READY') {
	        document.getElementById('standalone-info').style.display = 'block';
	        return;
	    }

	    document.getElementById("my-id").textContent = connection.localPseudonym;

	    if (sdk.getDisplayMode() === 'MESSAGE') {
	    	console.log("startApp enter");
	        initVoteMode();
	    } else {
	        initConfigMode();
	    }
	}

	startApp();


	sdk.onAppEvent((senderId, data, timestamp) => {
	    console.log(`User ${senderId} voted for data:`, data);
	    if (data.type === 'vote-update' || data.type === 'undo-update') {
	        localVote.votes = data.votes;
	        renderVote();
	        renderNotVotedList();
	    }
	});

	// sdk.onData((from, payload) => {
	// 	console.log("Reception:", payload);
	//     if (payload.type === 'vote-update') {
	//         localVote.votes = payload.votes;
	//         renderVote();
	//     }
	// });

	function initConfigMode() {
	    document.getElementById('header-app').style.display = 'block';
	    document.getElementById('configuration-votes').style.display = 'block';
	    document.getElementById('standalone-info').style.display = 'none';

	    document.getElementById('add-new-response').onclick = addResponse;
	    document.getElementById('create-vote-btn').onclick = createVote;
	    document.getElementById('cancel-vote-btn').onclick = () => sdk.closeApp();

	    document.addEventListener('click', function(e){
	        if (e.target.classList.contains('remove-response')) {
	            if (document.querySelectorAll('.response-item').length > 1) {
	                e.target.parentElement.remove();
	            }
	        }
	    });
	}

	function addResponse() {

	    const container = document.getElementById('vars-response');

	    const wrapper = document.createElement('div');
	    wrapper.className = 'response-item';

	    const input = document.createElement('input');
	    input.type = 'text';
	    input.className = 'response-input';
	    input.placeholder = 'Variant';

	    const removeBtn = document.createElement('button');
	    removeBtn.type = 'button';
	    removeBtn.className = 'remove-response';
	    removeBtn.textContent = 'X';

	    wrapper.appendChild(input);
	    wrapper.appendChild(removeBtn);
	    container.appendChild(wrapper);
	}

	async function createVote() {

	    const question = document.getElementById('question-input').value.trim();
	    const choiceType = document.querySelector('input[name="choice"]:checked').value;

	    const responses = [];
	    const votes = [];

	    document.querySelectorAll('.response-input').forEach(input => {
	        if (input.value.trim() !== '') {
	            responses.push(input.value.trim());
	            votes.push(0);
	        }
	    });

	    const voteData = { question, choiceType, responses, votes };

	    const messageId = await sdk.postMessage({
	        text: "New vote: " + question
	    });

	    await sdk.postAppContent(
	        'https://dahalakov.github.io/icantext-test/',
	        {
	            messageId: messageId,
	            vote: voteData
	        }, { 
    			interactionModel: 'OWNER_ONLY' 
			}
	    );

	    sdk.closeApp();
	}


	async function initVoteMode() {
		console.log("initVoteMode enter");
	    document.getElementById('vote-container').style.display = 'block';
	    document.getElementById('standalone-info').style.display = 'none';
	    document.getElementById('header-app').style.display = 'none';

	    currentContext = await sdk.getAppContext();
	    if (!currentContext) return;

	    localVote = currentContext.vote
	        ? JSON.parse(JSON.stringify(currentContext.vote))
	        : JSON.parse(JSON.stringify(currentContext));

	    renderVote();
	    renderNotVotedList();

	    document.getElementById('send-vote-btn').onclick = sendVote;
	    document.getElementById('undo-vote-btn').onclick = undoVote;
	}


	function renderVote() {

	    const question = document.getElementById('table-question');
	    const list = document.getElementById('vote-list');

	    question.textContent = localVote.question;
	    list.innerHTML = '';

	    const type = localVote.choiceType === 'multiple' ? 'checkbox' : 'radio';
	    const total = localVote.votes.reduce((a,b)=>a+b,0);

	    localVote.responses.forEach((label, index) => {

	        const li = document.createElement('li');

	        const input = document.createElement('input');
	        input.type = type;
	        input.name = 'vote';
	        input.value = index;
	        input.disabled = hasVoted;

	        const span = document.createElement('span');
	        span.textContent = label;

	        li.appendChild(input);
	        li.appendChild(span);

	        if (hasVoted) {
	            const percent = total > 0
	                ? ((localVote.votes[index] / total) * 100).toFixed(1)
	                : 0;

	            const info = document.createElement('small');
	            info.textContent = ` ${localVote.votes[index]} votes · ${percent}%`;
	            li.appendChild(info);
	        }

	        list.appendChild(li);
	    });
	}


	async function sendVote() {

	    if (hasVoted) return;

	    const selected = document.querySelectorAll('input[name="vote"]:checked');
	    if (selected.length === 0) {
	        alert('Please select an option');
	        return;
	    }

	    userVoteIndexes = [];

	    selected.forEach(input => {
	        const index = Number(input.value);
	        localVote.votes[index]++;
	        userVoteIndexes.push(index);
	    });

	    hasVoted = true;
	    // console.log("Envoi:", {
	    //     type: 'vote-update',
	    //     votes: localVote.votes
	    // });
	    // const targetIDs = await sdk.getPeers();
	    // console.log("targetIDs:", targetIDs);
	    // const activePeers = targetIDs.filter(p => p.isActiveOnApp);
	    // // console.log(activePeers);
	    // sdk.sendData(activePeers, {
	    //     type: 'vote-update',
	    //     votes: localVote.votes
	    // });

	    sdk.emitAppEvent({
	        type: 'vote-update',
	        votes: localVote.votes
	    });

	    renderVote();
	    renderNotVotedList();
	    showResult();
	}


	async function undoVote() {

	    userVoteIndexes.forEach(index => {
	        localVote.votes[index]--;
	    });

	    hasVoted = false;
	    userVoteIndexes = [];
	    // const targetIDs = await sdk.getPeers();
	    // const activePeers = targetIDs.filter(p => p.isActiveOnApp);
	    // sdk.sendData(activePeers, {
	    //     type: 'vote-update',
	    //     votes: localVote.votes
	    // });

	    sdk.emitAppEvent({
	        type: 'undo-update',
	        votes: localVote.votes
	    });

	    document.getElementById('vote-actions').style.display = 'flex';
	    document.getElementById('vote-result-info').style.display = 'none';
	    document.getElementById('vote-result-actions').style.display = 'none';

	    renderVote();
	    renderNotVotedList();
	}

	function showResult() {

	    document.getElementById('vote-actions').style.display = 'none';
	    document.getElementById('vote-result-info').style.display = 'block';
	    document.getElementById('vote-result-actions').style.display = 'flex';

	    const names = userVoteIndexes.map(i => localVote.responses[i]);

	    document.getElementById('vote-result-text').textContent =
	        'You voted for: ' + names.join(', ');
	}

	async function renderNotVotedList() {
		console.log("renderNotVotedList called");
	    const peers = await sdk.getPeers();
	    const activePeers = peers.filter(p => p.isActiveOnApp);

	    const events = await sdk.getAppEvents();
	    console.log(events);
	    // Храним пос1леднее состояние пользователя
	    const userState = [];
 		let votedCount = 0;
	    events.forEach(evt => {

	        if (evt.data.type === 'vote-update') {
	            userState[evt.senderId] = 'voted';
	            votedCount++;
	        }

	        if (evt.data.type === 'undo-update') {
	            userState[evt.senderId] = 'not-voted';
	        }

	    });

	    const list = document.getElementById('not-voted-list');
	    list.innerHTML = '';

	   

	    activePeers.forEach(peer => {

	        if (userState[peer.id] === 'voted') {
	           
	        } else {
	            const li = document.createElement('li');
	            li.textContent = peer.pseudonym;
	            list.appendChild(li);
	        }

	    });

	    const totalUsers = activePeers.length;

	    let progress = document.getElementById('vote-progress');

	    if (!progress) {
	        progress = document.createElement('div');
	        progress.id = 'vote-progress';
	        progress.style.marginTop = '10px';
	        document.getElementById('not-voted-block').prepend(progress);
	    }

	    progress.textContent = `${votedCount} / ${totalUsers} voted`;
	}
</script>
</body>
</html>
